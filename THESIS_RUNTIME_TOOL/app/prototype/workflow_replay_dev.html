const WORKFLOW_FIXTURE_ROOT = "fixtures/workflow_replay_v1/";
const WORKFLOW_RESUME_FIXTURE_ROOT = "fixtures/workflow_replay_resume_v1/";

function scenarioName() {
  const value = new URLSearchParams(window.location.search).get("scenario") || "valid";
  return new Set([
    "valid", "sequence-drift", "event-hash-drift", "arm-drift", "artifact-drift",
    "usage-valid", "usage-null", "usage-unknown-zero", "optional-details", "cursor-drift",
    "resume-valid", "resume-sequence-gap", "resume-attempt-regression",
  ]).has(value) ? value : "valid";
}

  return {

    physical_call_count: 1,
    cache_observation_count: 1,
    prompt_tokens: 120,
    completion_tokens: 40,
    reasoning_tokens: null,
    cached_input_tokens: 24,
    total_tokens: 160,
    cache_hit_count: 1,
    cache_miss_count: 1,
    unknown_attempt_count: 0,
    cost_status: "recorded",
    cost_usd: 0.0042,
    currency: "USD",
    snapshot_binding: { authority: "producer_sealed" },
    snapshot_sha256: "a".repeat(64),
    ...overrides,
  };
}

function typedDetail(componentId, kind, data) {
  return {
    schema_id: "WorkflowOptionalDetailV1",
    schema_version: "1.0.0",
    component_id: componentId,
    kind,
    data,
  };
}

function runSetupContractChecks(adapter) {
  const setupPayload = {
    schema_id: "WorkflowSetupReadModelV1",
    schema_version: "1.0.0",
    project_id: "project_fixture_v1",
    live_start_allowed: false,
    dry_run_allowed: true,
    source_package: {
      lifecycle: "finalized_pre_run",
      finalization_status: "finalized",
      chapter_count: 5,
      block_count: 2355,
      source_identity_sha256: "1".repeat(64),
    },
    runtime: { prepared: true, pipeline_run_count: 0 },
    chapters: [
      { chapter_id: "ch01", title: "Chapter 1", block_count: 471, selected_by_default: true },
      { chapter_id: "ch02", title: "Chapter 2", block_count: 466, selected_by_default: true },
    ],
    execution_modes: [
      { id: "dry_run", label: "0-API", enabled: true },
      { id: "live", label: "Live", enabled: true, reason: "Coordinator gate closed" },
    ],
    shared_options: [{
      id: "shared_api_v1",
      label: "Shared API profile",
      revision: "v1",
      sha256: "2".repeat(64),
      enabled: true,
      credential_status: { ref_id: "credential_ref_v1", available: true },
      capability_status: { json_object: true, streaming: true },
      fixed_facts: {
        source_id: "shared_source_v1",
        profile_id: "shared_profile_v1",
        requested_model_id: "model_alias_v1",
        output_mode: "json_object",
      },
    }],
    d2l_settings_options: [{
      id: "d2l_settings_v1",
      label: "D2L campaign V1",
      revision: "v1",
      sha256: "3".repeat(64),
      enabled: true,
      fixed_facts: { component_id: "translation", handoff: "s0+s1" },
    }],
    evaluation_settings_options: [{
      id: "evaluation_settings_v1",
      label: "Evaluation five-arm V1",
      revision: "v1",
      sha256: "4".repeat(64),
      enabled: true,
      fixed_facts: { arm_ids: ["s0", "s1", "community", "google_nmt", "llm_lc"] },
    }],
    defaults: {
      shared_option_id: "shared_api_v1",
      d2l_settings_option_id: "d2l_settings_v1",
      evaluation_settings_option_id: "evaluation_settings_v1",
      hard_total_token_cap: 200000,
      reserved_cost_cap_usd: 12,
    },
  };
  const setup = adapter.normalizeWorkflowSetup(setupPayload);
  const selection = setup.valid ? adapter.defaultWorkflowSelection(setup) : null;
  const dryRequest = adapter.buildWorkflowPreflightRequest(setup, selection);
  const liveRequest = adapter.buildWorkflowPreflightRequest(setup, { ...selection, executionMode: "live" });
  const preflight = adapter.normalizeWorkflowPreflight({
    schema_id: "WorkflowPreflightReadModelV1",
    schema_version: "1.0.0",
    valid: true,
    status: "ready",
    errors: [],
    warnings: ["live_start_allowed=false"],
    live_start_allowed: false,
    launch: {
      preflight_id: "preflight_fixture_v1",
      preflight_sha256: "5".repeat(64),
      confirm_token: "fixture-confirm-token",
      planned_run_id: "workflow_planned_fixture_v1",
    },
  }, setup, selection);
  const exposedSecretPayload = JSON.parse(JSON.stringify(setupPayload));
  exposedSecretPayload.shared_options[0].api_key = "must-not-be-exposed";
  const exposedSecret = adapter.normalizeWorkflowSetup(exposedSecretPayload);
  return {
    setupValid: setup.valid,
    dryRequestValid: dryRequest.valid,
    liveRequestRejected: liveRequest.valid === false,
    preflightValid: preflight.valid,
    liveStartBlocked: preflight.liveStartAllowed === false,
    exposedSecretRejected: exposedSecret.valid === false
      && exposedSecret.errors.some(error => error.code === "private_setup_field"),
  };
}

async function resealParentEvents(adapter, events) {
  let previous = null;
  for (const event of events) {
    event.integrity.previous_event_sha256 = previous;
    delete event.integrity.event_sha256;
    event.integrity.event_sha256 = await adapter.canonicalSha256(event);
    previous = event.integrity.event_sha256;
  }
}

    },

    event: "component_started",
    severity: "info",
    payload: {
      current_work_id: "evaluation_packet_1",
      progress: { completed: 2, total: 5, unit: "arms" },
      optional_details: [
        typedDetail("evaluation", "evaluation_progress", {
          completed_arms: 2,

          current_arm_id: "community",
        }),
        typedDetail("evaluation", "evaluation_metrics", {
          report_ref: "reports/score_run_partial.json",
          status: "partial",
        }),
        typedDetail("evaluation", "evaluation_aggregation", {
          aggregation_status: "pending",
          accepted_arm_count: 2,
        }),
        typedDetail("evaluation", "evaluation_verdict", {
          verdict: null,
          reason: "not_terminal",
        }),
      ],
    },
    integrity: { previous_event_sha256: null, event_sha256: "" },
  });
  await resealParentEvents(adapter, events);
  delete manifest.integrity.manifest_sha256;
  manifest.integrity.manifest_sha256 = await adapter.canonicalSha256(manifest);
}

async function loadAcceptedWorkflowPackage() {
  const adapter = window.WorkflowReplayAdapter;
  const scenario = scenarioName();
  const isResume = scenario.startsWith("resume-");
  const fixtureRoot = isResume ? WORKFLOW_RESUME_FIXTURE_ROOT : WORKFLOW_FIXTURE_ROOT;
  const [manifest, events, artifactIndex] = await Promise.all([
    adapter.fetchJson(fixtureRoot + "workflow_manifest.json"),
    adapter.fetchJsonLines(fixtureRoot + "events.jsonl"),
    adapter.fetchJson(fixtureRoot + "artifact_index.json"),
  ]);
  const [handoff, receipt] = isResume ? [null, null] : await Promise.all([
    adapter.fetchJson(WORKFLOW_FIXTURE_ROOT + "handoffs/scoring_handoff.json"),
    adapter.fetchJson(WORKFLOW_FIXTURE_ROOT + "handoffs/scoring_receipt.json"),
  ]);
  if (scenario === "sequence-drift") events.pop();
  if (scenario === "event-hash-drift" && events[1]) events[1].agent = "tampered_fixture_agent";
  if (scenario === "arm-drift" && receipt.accepted_translation_inputs?.length > 1) {
    [receipt.accepted_translation_inputs[0], receipt.accepted_translation_inputs[1]] = [receipt.accepted_translation_inputs[1], receipt.accepted_translation_inputs[0]];
  }
  if (scenario === "artifact-drift" && artifactIndex.artifacts?.[0]?.binding) {
    artifactIndex.artifacts[0].binding.sha256 = "0".repeat(64);
  }
  if (scenario === "resume-sequence-gap" && events[3]?.component) {
    events[3].component.component_seq += 1;
    await resealParentEvents(adapter, events);
  }
  if (scenario === "resume-attempt-regression" && events[4]?.component) {
    events[4].component.component_attempt_id = 1;
    events[4].component.component_attempt_index = 1;
    await resealParentEvents(adapter, events);
  }
  if (scenario === "optional-details") await addTypedDetails(adapter, manifest, events);
  const artifacts = handoff && receipt ? {
    "handoffs/scoring_handoff.json": handoff,
    "handoffs/scoring_receipt.json": receipt,
  } : {};
  const usageMode = scenario === "usage-valid" || scenario === "optional-details"
    ? "valid"
    : scenario === "usage-null"
      ? "null"
      : scenario === "usage-unknown-zero"
        ? "unknown-zero"
        : null;
  const cursor = {
    through_seq: events.length,
    event_chain_head_sha256: events.at(-1)?.integrity?.event_sha256 ?? null,
    package_revision_sha256: "d".repeat(64),
  };
  if (scenario === "cursor-drift") cursor.event_chain_head_sha256 = "0".repeat(64);
  return adapter.validatePackage({
    manifest,
    events,
    artifactIndex,
    artifacts,
    usage: usageMode ? makeUsageReadModel(manifest, usageMode) : null,
    cursor,
    actions: { pause_allowed: false, resume_allowed: false, cancel_allowed: false },
    artifactLinks: {},
    sourceMode: "replay",
  });
}

function WorkflowReplayHarness() {
  const [model, setModel] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [theme, setTheme] = React.useState("paper");
  const reload = React.useCallback(() => {
    setModel(null);
    setError(null);
    window.__workflowDevResult = null;
    loadAcceptedWorkflowPackage().then(result => {
      window.__workflowDevResult = result;
      setModel(result);
    }).catch(loadError => {
      window.__workflowDevResult = { valid: false, loadError: String(loadError?.message || loadError) };
      setError(loadError);
    });
  }, []);
  React.useEffect(reload, [reload]);
  React.useEffect(() => {
    const checks = runSetupContractChecks(window.WorkflowReplayAdapter);
    window.__workflowSetupChecks = checks;
    const allPassed = Object.values(checks).every(Boolean);
    const node = document.getElementById("setup-contract-gates");
    if (node) {
      node.textContent = `setup gates: ${allPassed ? "PASS" : "FAIL"}`;
      node.style.color = allPassed ? "#91c788" : "#ff8a80";
    }
  }, []);
  React.useEffect(() => {
    document.querySelectorAll(".dev-scenario a").forEach(link => {
      const target = new URL(link.href).searchParams.get("scenario") || "valid";
      if (target === scenarioName()) link.setAttribute("aria-current", "page");
    });
  }, []);
  if (error) return <div style={{ font: "13px monospace", color: "#ff8a80", padding: 20 }}>load failed: {String(error.message || error)}</div>;
  if (!model) return <div style={{ font: "13px monospace", color: "#aaa", padding: 20 }}>validating persisted package…</div>;
  const manifest = model.manifest || {};
  return (
    <AgentConsoleView
      runId={manifest.workflow_run_id || "invalid_workflow"}
      runs={[{ run_id: manifest.workflow_run_id || "invalid_workflow", status: manifest.status || "invalid", started_at: manifest.started_at }]}
      events={model.events}
      running={false}
      status={manifest.status || "invalid"}
      workflowReplay={model}
      projectId={manifest.job_id || "fixture"}
      theme={theme}
      onToggleTheme={() => setTheme(value => value === "paper" ? "dark" : "paper")}
      onRefresh={reload}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WorkflowReplayHarness />);
</script>
